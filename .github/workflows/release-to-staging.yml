name: Release to Staging

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN_DEPLOYMENT }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to ECR
      run: aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
    
    - name: Build and push Docker images
      run: |
        VERSION=${{ github.event.release.tag_name }}
        REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        
        docker build -t $REGISTRY/ticketing-api-gateway:$VERSION ./services/api-gateway
        docker build -t $REGISTRY/ticketing-user-service:$VERSION ./services/user-service
        docker build -t $REGISTRY/ticketing-movie-service:$VERSION ./services/movie-service
        docker build -t $REGISTRY/ticketing-booking-service:$VERSION ./services/booking-service
        docker build -t $REGISTRY/ticketing-payment-service:$VERSION ./services/payment-service
        docker build -t $REGISTRY/ticketing-notification-service:$VERSION ./services/notification-service
        
        docker push $REGISTRY/ticketing-api-gateway:$VERSION
        docker push $REGISTRY/ticketing-user-service:$VERSION
        docker push $REGISTRY/ticketing-movie-service:$VERSION
        docker push $REGISTRY/ticketing-booking-service:$VERSION
        docker push $REGISTRY/ticketing-payment-service:$VERSION
        docker push $REGISTRY/ticketing-notification-service:$VERSION
    
    - name: Update Kustomization with new image tags
      run: |
        VERSION=${{ github.event.release.tag_name }}
        KUSTOMIZE_FILE="kubernetes/overlays/staging/kustomization.yaml"
        
        # Remove old image overrides if they exist
        sed -i '' '/# Override image tags/,$ d' $KUSTOMIZE_FILE
        
        # Add new image overrides
        cat >> $KUSTOMIZE_FILE << 'KUSTOMIZE'
        
# Override image tags for staging deployment
images:
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-api-gateway
    newTag: VERSION_TAG
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-user-service
    newTag: VERSION_TAG
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-movie-service
    newTag: VERSION_TAG
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-booking-service
    newTag: VERSION_TAG
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-payment-service
    newTag: VERSION_TAG
  - name: 840080485121.dkr.ecr.us-east-1.amazonaws.com/ticketing-notification-service
    newTag: VERSION_TAG
KUSTOMIZE
        
        sed -i '' "s/VERSION_TAG/$VERSION/g" $KUSTOMIZE_FILE
    
    - name: Commit and push updated manifests
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add kubernetes/overlays/staging/kustomization.yaml
        git commit -m "Update image tags to ${{ github.event.release.tag_name }}" || true
        git push
    
    - name: Trigger infrastructure deployment
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GH_TOKEN_DEPLOYMENT }}
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: 'naren9876',
            repo: 'ticketing-infrastructure',
            event_type: 'deploy-staging',
            client_payload: {
              version: '${{ github.event.release.tag_name }}'
            }
          })

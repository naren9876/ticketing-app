name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== Code Quality ====================
  
  quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        npm install
        pip install -r requirements.txt flake8 pylint black isort
    
    - name: Lint JavaScript
      run: npm run lint || true
    
    - name: Format check JavaScript
      run: npx prettier --check . || true
    
    - name: Lint Python
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        pylint src/ --disable=all --enable=E || true
    
    - name: Format check Python
      run: black --check . || true

  # ==================== Unit Tests ====================
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ticketing_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticketing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        npm install
        pip install -r requirements.txt
    
    - name: Run Node tests
      run: npm test -- --coverage
      env:
        DATABASE_URL: postgres://ticketing_user:password@localhost:5432/ticketing_test
        REDIS_URL: redis://localhost:6379
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info

  # ==================== Security Scan ====================
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate || true
    
    - name: Check Python dependencies
      run: |
        pip install safety
        safety check --json || true

  # ==================== Docker Build ====================
  
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
    
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ==================== Deploy to Staging ====================
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yml
        export KUBECONFIG=$(pwd)/kubeconfig.yml
    
    - name: Deploy to Kubernetes (Staging)
      run: |
        kubectl apply -f kubernetes-deployment.yaml -n staging
        kubectl rollout status deployment/api-gateway -n staging
    
    - name: Run smoke tests
      run: |
        sleep 30
        curl -f http://api-gateway.staging.svc.cluster.local:3000/health || exit 1

  # ==================== Deploy to Production ====================
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://ticketing.example.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig.yml
        export KUBECONFIG=$(pwd)/kubeconfig.yml
    
    - name: Blue-Green Deployment
      run: |
        # Deploy to green environment
        kubectl apply -f kubernetes-deployment.yaml -n production-green
        kubectl rollout status deployment/api-gateway -n production-green
        
        # Run smoke tests
        sleep 30
        curl -f http://api-gateway.production-green.svc.cluster.local:3000/health || exit 1
        
        # Switch traffic to green
        kubectl patch service api-gateway -n production -p '{"spec":{"selector":{"version":"green"}}}'
        
        # Monitor
        sleep 60
        
        # Clean up old blue environment
        kubectl delete deployment -l version=blue -n production || true
    
    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "Production deployment ${{ job.status }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Production Deployment* - ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|View Commit>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ==================== Performance Test ====================
  
  performance:
    name: Performance Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install k6
      run: sudo apt-get install -y golang-k6
    
    - name: Start services
      run: docker-compose up -d
    
    - name: Wait for services
      run: sleep 30
    
    - name: Run performance tests
      run: |
        k6 run performance-tests/load-test.js --out json=results.json
    
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: results.json
